# platform-backend — test → build (amd64) → deploy API to VPS
#
# Optional repository secrets (Admin Telegram alerts):
#   TELEGRAM_ENABLED=true
#   TELEGRAM_BOT_TOKEN  — from @BotFather
#   TELEGRAM_CHAT_ID    — your user or group chat id
name: pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/saffron-rest/platform-backend

jobs:
  test:
    name: 1 · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  build:
    name: 2 · Build & push image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 3 · Deploy API to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: production
      url: http://cash-flow.saffron.waw.pl/api/health
    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          missing=0
          if [ -z "$VPS_HOST" ]; then echo "::error::Missing secret VPS_HOST"; missing=1; fi
          if [ -z "$VPS_USER" ]; then echo "::error::Missing secret VPS_USER"; missing=1; fi
          if [ -z "$SSH_PRIVATE_KEY" ] && [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Missing SSH_PRIVATE_KEY or VPS_SSH_KEY"
            missing=1
          fi
          if [ -z "$GHCR_TOKEN" ]; then echo "::error::Missing GHCR_TOKEN"; missing=1; fi
          if [ -z "$GHCR_USERNAME" ]; then echo "::error::Missing GHCR_USERNAME"; missing=1; fi
          if [ -z "$POSTGRES_PASSWORD" ]; then echo "::error::Missing POSTGRES_PASSWORD (must match VPS Postgres)"; missing=1; fi
          if [ -z "$JWT_SECRET" ]; then echo "::error::Missing JWT_SECRET"; missing=1; fi
          exit "$missing"

      - name: Upload deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: deploy/
          target: /docker/saffron-backend/
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ${{ env.IMAGE }}:latest
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_BOOTSTRAP_EMPTY_DATABASE: ${{ secrets.APP_BOOTSTRAP_EMPTY_DATABASE }}
          APP_SEED_ADMIN_PASSWORD: ${{ secrets.APP_SEED_ADMIN_PASSWORD }}
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REGISTRY_USER: ${{ secrets.GHCR_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: BACKEND_IMAGE,POSTGRES_USER,POSTGRES_DB,POSTGRES_PASSWORD,JWT_SECRET,APP_BOOTSTRAP_EMPTY_DATABASE,APP_SEED_ADMIN_PASSWORD,TELEGRAM_ENABLED,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,REGISTRY_USER,REGISTRY_PASSWORD
          script: |
            docker volume inspect saffron_saffron_uploads >/dev/null 2>&1 \
              || docker volume create saffron_saffron_uploads
            chmod +x /docker/saffron-backend/deploy.sh
            export VPS_APP_DIR=/docker/saffron-backend
            export POSTGRES_USER="${POSTGRES_USER:-saffron}"
            export POSTGRES_DB="${POSTGRES_DB:-cashflow}"
            export APP_BOOTSTRAP_EMPTY_DATABASE="${APP_BOOTSTRAP_EMPTY_DATABASE:-false}"
            bash /docker/saffron-backend/deploy.sh
