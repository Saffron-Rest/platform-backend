server:
  port: 3001

spring:
  application:
    name: saffron-cashflow-api
  datasource:
    url: jdbc:postgresql://localhost:5432/cashflow
    username: saffron
    password: saffron
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      # Phone photos routinely exceed 5MB (especially iPhone HEIC/JPG at
      # 12+ Mpx). Bump both per-file and per-request caps so menu photo
      # uploads stop silently failing with 413/MaxUploadSizeExceeded.
      max-file-size: 25MB
      max-request-size: 30MB

app:
  timezone: Europe/Warsaw
  # Set this to the public origin where the backend is reachable (e.g.
  # https://api.saffron.example.com). Used when registering Dotypos webhooks
  # so they know where to push receipts. In dev you can pass the override per
  # request from the admin UI instead.
  public-base-url: ${PUBLIC_BASE_URL:}
  jwt:
    secret: saffron-dev-jwt-secret-change-in-production-min-32-chars
    expiration-ms: 604800000
  upload-dir: ./uploads
  notifications:
    tomorrow-reminder-hour: 18
    missing-report-hour: 12
  dotykacka:
    # Background polling acts as a safety net even when the webhook is active.
    sync-ms: 300000
    initial-delay-ms: 60000
