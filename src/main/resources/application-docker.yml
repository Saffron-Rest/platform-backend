spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/cashflow}
    username: ${SPRING_DATASOURCE_USERNAME:saffron}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  upload-dir: ${APP_UPLOAD_DIR:/data/uploads}
  timezone: ${APP_TIMEZONE:Europe/Warsaw}
  notifications:
    missing-report-hour: ${APP_MISSING_REPORT_HOUR:12}
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
